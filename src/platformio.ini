; SAFE_LINK firmware. Keep this file in the repository root; sources live in src/.
; Hardware: ATmega328P-PU, 8 MHz crystal, 3.3 V. Program with a USBasp set to 3.3 V (or power the board from its own battery).
[env:safelink]
platform = atmelavr
board = pro8MHzatmega328
framework = arduino
upload_protocol = usbasp
board_build.f_cpu = 8000000L
board_fuses.lfuse = 0xFF
board_fuses.hfuse = 0xD9
board_fuses.efuse = 0xFD
build_flags = -Os
; No external libraries: Wire and SoftwareSerial ship with the Arduino AVR core.

[env:safelink_debug]
extends = env:safelink
; debug text on test pad TP1 (PC3), 9600 baud
build_flags = -Os -DSAFELINK_DEBUG=1
