; Fastest path to a working MVP: Arduino core on ATmega328P, uploaded with USBasp.
; Set the USBasp jumper to 3.3 V (or power the board from its own battery and do not power it from the programmer).
[env:safelink]
platform = atmelavr
board = pro8MHzatmega328
framework = arduino
upload_protocol = usbasp
board_build.f_cpu = 8000000L
board_fuses.lfuse = 0xFF
board_fuses.hfuse = 0xD9
board_fuses.efuse = 0xFD
lib_deps =
    mikalhart/TinyGPSPlus
    jrowberg/I2Cdevlib-MPU6050
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library
    ; SoftwareSerial is built into the AVR Arduino core
